version: '3.8'

services:
  # Base de Datos PostgreSQL local en contenedor
  postgres:
    image: postgres:15-alpine
    container_name: firmadigital-postgres
    restart: always
    environment:
      POSTGRES_DB: db_grupo26sa
      POSTGRES_USER: grupo26sa
      POSTGRES_PASSWORD: grup026grup026*
    ports:
      - "5432:5432"
    volumes:
      - pgdata_firma:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grupo26sa -d db_grupo26sa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor de Correo Local POP3/SMTP (GreenMail)
  mailserver:
    image: greenmail/standalone:2.1.0
    container_name: firmadigital-mailserver
    restart: always
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=grupo26sa:grup026grup026*@tecnoweb.org.bo,alumno:123456@tecnoweb.org.bo,docente:123456@tecnoweb.org.bo,vicerrector:123456@tecnoweb.org.bo,alumno@tecnoweb.org.bo:123456@tecnoweb.org.bo,docente@tecnoweb.org.bo:123456@tecnoweb.org.bo,grupo26sa@tecnoweb.org.bo:grup026grup026*@tecnoweb.org.bo
    ports:
      - "25:25"     # SMTP
      - "110:110"   # POP3
      - "143:143"   # IMAP
      - "8080:8080"   # API / Dashboard GreenMail

  # Cliente de Correo Webmail (Interfaz Gráfica tipo Thunderbird / Gmail)
  webmail:
    image: roundcube/roundcubemail:latest
    container_name: firmadigital-webmail
    restart: always
    ports:
      - "8085:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailserver
      ROUNDCUBEMAIL_SMTP_SERVER: mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 25
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_USERNAME_DOMAIN: tecnoweb.org.bo
    depends_on:
      - mailserver

  # Demonio de Aplicación Java - Sistema de Firma Digital
  app:
    build: .
    container_name: firmadigital-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      MAIL_HOST: mailserver
      MAIL_SMTP_PORT: 25
      MAIL_POP_PORT: 110

volumes:
  pgdata_firma:
