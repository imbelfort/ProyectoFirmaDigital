version: '3.8'

services:
  # Base de Datos PostgreSQL local en contenedor
  postgres:
    image: postgres:15-alpine
    container_name: firmadigital-postgres
    restart: always
    environment:
      POSTGRES_DB: db_grupo20sa
      POSTGRES_USER: grupo20sa
      POSTGRES_PASSWORD: grup020grup020*
    ports:
      - "5432:5432"
    volumes:
      - pgdata_firma:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grupo20sa -d db_grupo20sa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor de Correo Local POP3/SMTP (GreenMail)
  mailserver:
    image: greenmail/standalone:2.1.0
    container_name: firmadigital-mailserver
    restart: always
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=grupo20sa@tecnoweb.org.bo:grup020grup020*,alumno@tecnoweb.org.bo:123456,docente@tecnoweb.org.bo:123456,vicerrector@tecnoweb.org.bo:123456
    ports:
      - "25:3025"     # SMTP
      - "110:3110"   # POP3
      - "8080:8080"   # API / Dashboard GreenMail

  # Demonio de Aplicación Java - Sistema de Firma Digital
  app:
    build: .
    container_name: firmadigital-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      MAIL_HOST: mailserver
      MAIL_SMTP_PORT: 3025
      MAIL_POP_PORT: 3110

volumes:
  pgdata_firma:
